name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # A lógica (sessão, bateria, hora extra, aparência, histórico) não depende de JavaFX
      # na tela, então os testes rodam sem display.
      - run: ./mvnw -B verify

  pacote:
    name: Pacote Windows
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runtime próprio com Java embutido: quem baixar não precisa ter Java instalado.
      - run: ./mvnw -B javafx:jlink
      - uses: actions/upload-artifact@v7
        with:
          name: robodoro-windows
          path: target/robodoro.zip
